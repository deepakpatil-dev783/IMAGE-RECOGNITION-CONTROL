model:
  architecture: resnet50
  num_classes: 2
  pretrained: true
  input_size: 224
  dropout: 0.4

training:
  epochs: 50
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.0001
  scheduler: cosine
  early_stopping_patience: 10
  val_split: 0.2
  seed: 42

augmentation:
  horizontal_flip: true
  vertical_flip: false
  rotation_limit: 15
  brightness_contrast: true
  gaussian_noise: true
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

classes:
  0: PASS
  1: DEFECT

defect_codes:
  D001: Surface Scratch
  D002: Dent / Deformation
  D003: Color Mismatch
  D004: Missing Component
  D005: Dimensional Deviation

paths:
  data_dir: data/raw
  processed_dir: data/processed
  reports_dir: data/reports
  model_dir: models/
  log_dir: logs/

inference:
  confidence_threshold: 0.85
  batch_size: 16

reporting:
  company_name: "Acme Manufacturing Co."
  report_format: pdf
  include_annotated_images: true
